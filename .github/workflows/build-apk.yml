name: Build Taif QX AI APK

on:
  push:
    branches: [main]
    paths:
      - 'Taif-QX-AI-Ready-for-GitHub.zip'
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          test -f Taif-QX-AI-Ready-for-GitHub.zip
          unzip -q Taif-QX-AI-Ready-for-GitHub.zip -d project

      - name: Inspect app UI integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('project/taif-qx-ai-android/app/src/main/java')
          for p in root.rglob('*.kt'):
              s = p.read_text(errors='ignore')
              keys = ('Timeframe', 'timeframe', 'Market Selector', 'MarketType', 'FloatingScannerService')
              if any(k in s for k in keys):
                  print('\n===== FILE:', p, '=====')
                  lines = s.splitlines()
                  hits = [i for i, line in enumerate(lines) if any(k in line for k in keys)]
                  shown = set()
                  for i in hits[:12]:
                      for j in range(max(0, i-5), min(len(lines), i+9)):
                          if j not in shown:
                              print(str(j+1) + ': ' + lines[j])
                              shown.add(j)
          PY
      - name: Apply Android screen-capture compatibility fix
        run: python3 scripts/patch_media_projection.py

      - name: Build debug APK
        run: gradle --no-daemon -p project/taif-qx-ai-android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taif-QX-AI-debug-apk
          path: project/taif-qx-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
