name: Build Taif QX AI APK

on:
  push:
    branches: [main]
    paths:
      - 'Taif-QX-AI-Ready-for-GitHub.zip'
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          test -f Taif-QX-AI-Ready-for-GitHub.zip
          unzip -q Taif-QX-AI-Ready-for-GitHub.zip -d project

      - name: Inspect app UI integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('project/taif-qx-ai-android/app/src/main/java/com/taif/qxai')
          targets = {
              'ui/screens/HomeScreen.kt': (1, 245),
              'service/FloatingScannerService.kt': (175, 250),
              'MainActivity.kt': (1, 190),
          }
          for rel, (start, end) in targets.items():
              p = root / rel
              lines = p.read_text(errors='ignore').splitlines()
              print('\\n===== SOURCE:', rel, '=====')
              for i in range(start-1, min(end, len(lines))):
                  print(str(i+1) + ': ' + lines[i])
          PY
      - name: Apply Android screen-capture compatibility fix
        run: python3 scripts/patch_media_projection.py

      - name: Build debug APK
        run: gradle --no-daemon -p project/taif-qx-ai-android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taif-QX-AI-debug-apk
          path: project/taif-qx-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
