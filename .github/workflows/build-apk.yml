name: Build Taif QX AI APK

on:
  push:
    branches: [main]
    paths:
      - 'Taif-QX-AI-Ready-for-GitHub.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          test -f Taif-QX-AI-Ready-for-GitHub.zip
          unzip -q Taif-QX-AI-Ready-for-GitHub.zip -d project

      - name: Build debug APK
        run: gradle --no-daemon -p project/taif-qx-ai-android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taif-QX-AI-debug-apk
          path: project/taif-qx-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
